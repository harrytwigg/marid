name: CI

on:
  push:
    branches: [main, feature/project-phoenix]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Contributors push several times in a row while iterating. Without this, every
# intermediate commit occupied a runner to produce a result nobody reads.
# Keyed per PR (or per ref on push); pushes to main are never cancelled, because
# main's result is the one that has to be trustworthy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Fork PRs run under the `pull_request` trigger, which checks out the fork's
# code but grants it NO repository secrets and a read-only GITHUB_TOKEN.
# Declared explicitly so a future default change cannot widen it silently.
# DO NOT switch to `pull_request_target`: that runs with the base repo's
# secrets and a writable token in the context of untrusted fork code.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # ESLint's core rules carry fixed messages that a config cannot override,
      # so the remediation lives here — the one place a contributor reading a red
      # run is already looking.
      - name: How to clear these
        if: failure()
        run: |
          cat <<'EOF'
          The lint floor is six rules, all errors. Change the code, not the config.

            complexity, max-lines-per-function
              Split the function at its seams into named helpers, and give the
              branchy part its own function with an early return per case.
            max-depth
              Hoist the nested loop or condition into a helper so the body reads flat.
            max-params
              Group the related parameters into one options object.
            @typescript-eslint/no-floating-promises
              Await the promise, or hand it to `void` when the result is genuinely
              not wanted.
            @typescript-eslint/no-unused-vars
              Remove the binding. If a signature forces it to exist, rename it with
              a leading underscore.

          Inline eslint-disable comments are ignored outright, so
          eslint-baseline.json is the only suppression channel. It grandfathers code
          that predates the floor and is meant to shrink: run
          `node scripts/eslint-baseline.mjs` after a fix removes an entry, never to
          add one for new code.
          EOF

  footguns:
    runs-on: ubuntu-latest
    steps:
      # The checker judges the lines this change ADDS, which needs a merge base;
      # a shallow clone has none, and the run would silently widen to the whole
      # tree, where hundreds of pre-existing lines match.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The spawn-without-stdio rule parses TypeScript rather than grepping for
      # `spawn(`, so it needs the workspace's own typescript.
      - run: pnpm install --frozen-lockfile

      # On a pull request the base branch is what the change is measured
      # against. A push to main has no base_ref, and its own parent is the only
      # honest answer - a missing base must not quietly pass everything.
      - name: Footguns added by this change
        run: node scripts/check-footguns.mjs --diff "${BASE:-HEAD^}"
        env:
          BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}

      # The whole tree, not the diff: the old names (Jinn, Marid) may stay only where
      # scripts/rename-codename/rules.mjs says why. The flags go as the docs and the
      # install and publish names are renamed.
      - name: No old name outside the allowed places
        run: node scripts/rename-codename.mjs --check --skip-docs --skip-distribution

  unit-tests:
    name: unit-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung node-pty/PTY test on Windows would otherwise hold a runner for the
    # 6-hour default. Ubuntu currently finishes well inside this.
    timeout-minutes: 30
    strategy:
      # One OS failing must not cancel the other's logs - the whole point of the
      # Windows leg is reading its output.
      fail-fast: false
      matrix:
        # Windows is a first-class leg. It was opt-in while the repo could not be
        # built there at all; #97 fixed the build, #101 the ACL checks, and the
        # remaining Windows-only test failures are fixed in the same change that
        # turned this on — so it arrives green rather than as a red box everyone
        # learns to ignore.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `pnpm build` leaves packages/web/out in place — sync-web-dist.mjs only
      # clears its own target under packages/hundredfold/dist/web — so the bundle-size
      # gate reads this job's output instead of paying for a second build.
      - name: Web performance budgets
        run: pnpm --filter @hundredfold/web perf:budget

  coverage:
    runs-on: ubuntu-latest
    # A v8-instrumented run of the hundredfold suite, which already uses most of
    # `unit-tests`' 30 minutes uninstrumented.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm coverage

  docker:
    runs-on: ubuntu-latest
    # The failure worth catching is a gateway that builds but cannot spawn a
    # session — a wrong-ABI sqlite binding, or a skipped node-pty build. `docker
    # build` never loads a native addon or starts the gateway, so the two steps
    # after it are what actually exercise that. Plain `docker build` because
    # nothing is published and fork PRs get a read-only token.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag hundredfold:ci .

      # Formula/hundredfold.rb asserts the same for the Homebrew install. --workdir is the
      # hundredfold package because pnpm links these under packages/hundredfold/node_modules.
      # Fails closed: a lost exit event must not drain the loop and exit 0.
      - name: Native addons load and a PTY spawns
        run: |
          docker run --rm --workdir /opt/hundredfold/packages/hundredfold --entrypoint node hundredfold:ci -e '
            process.exitCode = 1;
            const Database = require("better-sqlite3");
            new Database(":memory:").close();
            const pty = require("node-pty");
            const timer = setTimeout(() => {
              console.error("pty exit event never arrived");
              process.exit(1);
            }, 30000);
            const p = pty.spawn("/bin/sh", ["-c", "exit 0"], {});
            p.onExit(({ exitCode }) => {
              clearTimeout(timer);
              if (exitCode !== 0) { console.error("pty exited " + exitCode); return; }
              process.exitCode = 0;
              console.log("better-sqlite3 + node-pty OK");
            });
          '

      # End-to-end boot: first-run `hundredfold setup` on an empty volume,
      # scripts/docker-configure.mjs (which now exits non-zero rather than leaving
      # the gateway on the container's loopback), and the port publish. /api/status
      # is deliberately auth-exempt, so this needs no token.
      - name: Gateway boots and answers
        run: |
          set -o pipefail
          # Both docker calls tolerate a container that is already gone: under `bash -e`
          # a failure inside the helper aborts the step before it reaches the echo, so
          # the one message explaining the failure would be lost with it.
          give_up() {
            docker logs hundredfold-smoke || true
            docker rm -f hundredfold-smoke >/dev/null 2>&1 || true
            echo "$1"
            exit 1
          }
          # -m: a gateway that accepts and never answers would otherwise hold the step
          # until the job timeout instead of reaching give_up.
          wait_for_status() {
            for _ in $(seq 1 60); do
              curl -fsS -m 5 http://127.0.0.1:7777/api/status >/dev/null 2>&1 && return 0
              sleep 2
            done
            return 1
          }

          docker run -d --name hundredfold-smoke --init -p 127.0.0.1:7777:7777 hundredfold:ci
          wait_for_status || give_up "gateway never answered on /api/status"

          # A healthy public status route does not prove the auth boundary survived the
          # image/entrypoint wiring. A protected read must reject a request with no token.
          protected_status=$(curl -sS -m 10 -o /tmp/hundredfold-protected.json -w '%{http_code}' \
            http://127.0.0.1:7777/api/sessions) \
            || give_up "the protected-route auth probe could not reach the gateway"
          [ "$protected_status" = "401" ] \
            || give_up "unauthenticated /api/sessions returned HTTP $protected_status instead of 401"

          # The dashboard, not just the API: a build filtered to the hundredfold package ships a
          # gateway with no UI, and /api/status answers 200 either way. `id="root"` is the
          # marker dashboardIsReady() uses in gateway/lifecycle.ts. Not piped into grep —
          # `grep -q` closes the pipe on the first match and curl then fails under pipefail.
          curl -fsS -m 10 http://127.0.0.1:7777/ -o /tmp/hundredfold-index.html \
            || give_up "the gateway did not serve / at all"
          grep -q 'id="root"' /tmp/hundredfold-index.html \
            || give_up "the gateway served no dashboard at / (image built without dist/web?)"

          # The HEALTHCHECK is the only signal for a gateway that is alive but not serving,
          # so a broken probe is a silent loss of it. `|| true` because docker inspect exits
          # non-zero on a container that has gone, which under `bash -e` would kill the step
          # before give_up() dumps the logs.
          health=
          for _ in $(seq 1 45); do
            health=$(docker inspect --format '{{.State.Health.Status}}' hundredfold-smoke 2>/dev/null || true)
            [ "$health" = "healthy" ] && break
            sleep 2
          done
          [ "$health" = "healthy" ] || give_up "HEALTHCHECK never reported healthy (last: ${health:-none})"

          # A leftover gateway.pid names a number the next container has recycled, and it
          # answers kill(pid, 0) as an unrelated process — `hundredfold start` then detaches and
          # exits PID 1 into a restart loop. The boot has to clear it.
          docker exec hundredfold-smoke sh -c 'echo 1 > /home/node/.jinn/gateway.pid'
          docker restart hundredfold-smoke >/dev/null
          wait_for_status || give_up "gateway did not come back after a restart with a stale gateway.pid"

          docker logs hundredfold-smoke
          docker rm -f hundredfold-smoke >/dev/null

  all-checks-pass:
    runs-on: ubuntu-latest
    # The single status check branch protection requires on main. Every other job
    # in this file is listed below, so a job added later cannot land outside
    # protection - scripts/__tests__/ci-workflow.test.mjs fails the build when one
    # is missing from `needs`.
    #
    # `always()` is what makes that protection real: without it the job is skipped
    # the moment a dependency fails, and a required check that never ran does not
    # report as a red one.
    if: always()
    needs: [typecheck, lint, footguns, unit-tests, build, coverage, docker]
    steps:
      # No `pnpm install`: the checker imports nothing outside node: builtins.
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Every required job succeeded
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-required-jobs.mjs
