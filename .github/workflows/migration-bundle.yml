name: Migration bundle

# The release skill runs the same check before tagging; catching a stale bundle
# here makes it one more commit on a PR instead of a scramble at release time.
# The bundle is derived from a diff of packages/jinn/template/, so any
# edit under it can stale the bundle, not only edits to template/migrations/.
#
# Path-filtered workflows report nothing on PRs that miss their paths, so this
# must not be configured as a required check — it would block every other PR.
on:
  pull_request:
    paths:
      - "packages/jinn/template/**"
      - "packages/jinn/scripts/instance-migration-bundle.mjs"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # The check diffs against the previous release tag, which `git describe`
          # can only find with the full history and tags present.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify migration bundle
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./packages/jinn/package.json').version")"
          VERSION="$(find packages/jinn/template/migrations -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -1)"
          test -n "$VERSION"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Checking unreleased migration $VERSION while package remains at $PACKAGE_VERSION"
          fi
          # Same derivation and command as the release skill's step 4, so a PR
          # cannot pass a check the release then fails. The branch matters: --base-ref is
          # validated as a version tag, and once v$VERSION is tagged, passing it
          # would diff the version against itself and always report current.
          # Only plain release tags count: any other tag (a deploy marker or a
          # prerelease, say) would be picked as the base and then rejected by
          # --base-ref validation.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            BASE="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "v$VERSION^" 2>/dev/null || true)"
          else
            BASE="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "::error::No release tag (v*) is reachable from this commit, so there is no base to diff the template against. The release tags must be present in this repository for the check to run."
            exit 1
          fi
          pnpm --filter jinn-cli migration:check -- --base-ref "$BASE" --version "$VERSION" --allow-unreleased
